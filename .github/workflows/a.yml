name: sync scripts

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      

      - name: get scripts
        run: |
          git clone https://github.com/salvogiangri/UN1CA.git tmp
          
          cp -R tmp/scripts .
          rm -rf tmp

      - name: force push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add scripts
          git commit -m "sync scripts" || exit 0
          git push --force
